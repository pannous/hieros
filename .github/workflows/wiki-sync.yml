name: Sync wiki submodule

on:
  gollum:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Update docs submodule to latest wiki commit
        id: sync
        run: |
          git submodule update --remote docs
          if git diff --quiet -- docs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "chore: auto-sync docs (wiki) submodule [gollum]"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, retrying with rebase (attempt $i)..."
            git fetch origin master
            git rebase origin/master
            sleep $((RANDOM % 5 + 1))
          done
          git push

      # A push made with the default GITHUB_TOKEN does not itself trigger
      # other workflows' `on: push` (loop prevention) -- workflow_dispatch
      # is exempted from that restriction, so trigger the Pages build
      # explicitly instead of relying on the push above.
      - name: Trigger Pages build
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run jekyll-gh-pages.yml --repo ${{ github.repository }} --ref master
